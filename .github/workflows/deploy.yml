name: Deploy Hexo Blog to GitHub Pages

on:
  push:
    branches:
      - main  # 如果你用的是 master 分支，改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install

      - name: 生成静态文件
        run: npx hexo generate --config _config.yml,_config.github.yml  # 如果 hexo generate 不生效，可改为 npx hexo generate

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 静态文件推送到 gh-pages 分支